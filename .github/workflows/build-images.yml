name: Build and publish images

on:
  workflow_dispatch:
  push:
    branches:
      - "main"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  build:
    name: Build ${{ matrix.image }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: lokso-backend
            service: lokso-api
            context: apps/api
            dockerfile: apps/api/Dockerfile.api
          - image: lokso-frontend
            service: lokso-web
            context: .
            dockerfile: apps/web/Dockerfile.web
          - image: lokso-admin
            service: lokso-admin
            context: .
            dockerfile: apps/admin/Dockerfile.admin
          - image: lokso-space
            service: lokso-space
            context: .
            dockerfile: apps/space/Dockerfile.space
          - image: lokso-live
            service: lokso-live
            context: .
            dockerfile: apps/live/Dockerfile.live
    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}:latest
          labels: |
            service=${{ matrix.service }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
