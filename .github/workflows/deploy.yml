name: Deploy

on:
  workflow_run:
    workflows: ["Build and publish images"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: "Полный SHA коммита, образы которого уже в GHCR. Пусто — текущий main."
        required: false
        type: string
      destinations:
        description: "Что катить: back web admin space live через пробел. Пусто — определить по изменениям."
        required: false
        type: string
      first_run:
        description: "Холодный старт: поставить Docker, поднять аксессуары, создать сеть. Только на пустом сервере."
        required: false
        default: false
        type: boolean

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ -n "$INPUT_VERSION" ]; then
            SHA="$INPUT_VERSION"
          else
            SHA="$(git rev-parse HEAD)"
          fi
          if ! printf '%s' "$SHA" | grep -qE '^[0-9a-f]{40}$'; then
            echo "::error::Ожидался полный SHA из 40 hex-символов, получено: $SHA"
            exit 1
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Choose destinations
        id: targets
        env:
          INPUT_DESTINATIONS: ${{ inputs.destinations }}
          FIRST_RUN: ${{ inputs.first_run }}
        run: |
          set -euo pipefail

          valid="back web admin space live"

          select_all() { echo "web back admin space live"; }

          if [ -n "$INPUT_DESTINATIONS" ]; then
            chosen="$INPUT_DESTINATIONS"
          elif [ "$FIRST_RUN" = "true" ]; then
            chosen="$(select_all)"
          else
            changed="$(git diff --name-only HEAD~1 HEAD 2>/dev/null || echo "")"
            if [ -z "$changed" ]; then
              chosen="$(select_all)"
            else
              set +e
              picked=""
              echo "$changed" | grep -qE '^(apps/api/|config/deploy\.back\.yml)' && picked="$picked back"
              echo "$changed" | grep -qE '^(apps/web/|packages/|config/deploy\.web\.yml)' && picked="$picked web"
              echo "$changed" | grep -qE '^(apps/admin/|packages/|config/deploy\.admin\.yml)' && picked="$picked admin"
              echo "$changed" | grep -qE '^(apps/space/|packages/|config/deploy\.space\.yml)' && picked="$picked space"
              echo "$changed" | grep -qE '^(apps/live/|packages/|config/deploy\.live\.yml)' && picked="$picked live"
              echo "$changed" | grep -qE '^(config/deploy\.yml|\.kamal/)' && picked="$(select_all)"
              set -e
              chosen="$picked"
            fi
          fi

          ordered=""
          for d in web back admin space live; do
            case " $chosen " in *" $d "*) ordered="$ordered $d";; esac
          done

          for d in $ordered; do
            case " $valid " in
              *" $d "*) ;;
              *) echo "::error::Неизвестный destination: $d"; exit 1;;
            esac
          done

          ordered="$(echo "$ordered" | xargs || true)"
          if [ -z "$ordered" ]; then
            echo "Изменения не затронули ни один сервис — деплой не нужен."
          else
            echo "Катим: $ordered"
          fi
          echo "list=$ordered" >> "$GITHUB_OUTPUT"

      - name: Set up Ruby
        if: steps.targets.outputs.list != ''
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true

      - name: Start SSH agent
        if: steps.targets.outputs.list != ''
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          eval "$(ssh-agent -s)"
          echo "$SSH_PRIVATE_KEY" | ssh-add -
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> "$GITHUB_ENV"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy
        if: steps.targets.outputs.list != ''
        env:
          KAMAL_REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          LIVE_SERVER_SECRET_KEY: ${{ secrets.LIVE_SERVER_SECRET_KEY }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          RABBITMQ_PASSWORD: ${{ secrets.RABBITMQ_PASSWORD }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          EMAIL_HOST_PASSWORD: ${{ secrets.EMAIL_HOST_PASSWORD }}
          VERSION: ${{ steps.version.outputs.sha }}
          FIRST_RUN: ${{ inputs.first_run }}
          DESTINATIONS: ${{ steps.targets.outputs.list }}
        run: |
          set -euo pipefail

          if [ "$FIRST_RUN" = "true" ]; then
            COMMAND=setup
          else
            COMMAND=deploy
          fi

          for destination in $DESTINATIONS; do
            bundle exec kamal "$COMMAND" -P -d "$destination" --version="$VERSION"
          done
