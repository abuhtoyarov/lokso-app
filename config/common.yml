# Общая часть всех пяти конфигов Kamal.
#
# Kamal не наследует конфиги друг от друга: каждый файл, переданный в -c, —
# самостоятельное приложение. Поэтому одинаковые блоки не наследуются, а
# подставляются через ERB:
#
#   <%= File.binread("config/common.yml") %>
#
# Именно binread. Kamal читает шаблон как BINARY, и обычный File.read вернул
# бы UTF-8 — на кириллице в комментариях получим
# Encoding::CompatibilityError вместо конфига.
#
# Всё, что отличается — service, image, servers, proxy, env, — остаётся в
# файле сервиса.

registry:
  server: ghcr.io
  username: abuhtoyarov
  password:
    - KAMAL_REGISTRY_PASSWORD

builder:
  arch: amd64

ssh:
  user: apps
