# Сервер совместного редактирования на /live.
#
#   kamal deploy -P -c config/deploy.live.yml --version=<sha>

service: lokso-live
image: abuhtoyarov/lokso-live

servers:
  web:
    hosts:
      - 176.108.250.162

proxy:
  ssl: true
  host: app.lokso.ru
  app_port: 3000
  path_prefix: /live
  # Сервер монтирует роутер по LIVE_BASE_PATH (apps/live/src/server.ts:39),
  # то есть ждёт путь вместе с префиксом.
  strip_path_prefix: false

registry:
  server: ghcr.io
  username: abuhtoyarov
  password:
    - KAMAL_REGISTRY_PASSWORD

builder:
  arch: amd64

ssh:
  user: apps

env:
  clear:
    # Живёт на том же хосте, поэтому ходит в API через публичный адрес.
    # Схема env.ts требует именно валидный URL, пустая строка не пройдёт.
    API_BASE_URL: https://app.lokso.ru
    CORS_ALLOWED_ORIGINS: https://app.lokso.ru
    LIVE_BASE_PATH: /live
    REDIS_URL: redis://lokso-api-redis:6379/
  secret:
    # Тот же секрет, что у бэкенда: им live проверяет входящие запросы
    # (apps/live/src/lib/auth-middleware.ts:38).
    - LIVE_SERVER_SECRET_KEY
