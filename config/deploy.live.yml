service: lokso-live
image: abuhtoyarov/lokso-live

servers:
  web:
    hosts:
      - 176.108.250.162

proxy:
  host: app.lokso.ru
  app_port: 3000
  path_prefix: /live
  strip_path_prefix: false
  healthcheck:
    path: /live/health

env:
  clear:
    API_BASE_URL: https://app.lokso.ru
    CORS_ALLOWED_ORIGINS: https://app.lokso.ru
    LIVE_BASE_PATH: /live
    REDIS_URL: redis://lokso-api-redis:6379/
  secret:
    - LIVE_SERVER_SECRET_KEY
